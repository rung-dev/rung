name: container

# Build the rung image and push it to GHCR (the repo's Packages tab) on each
# published release. Built from the tagged source, so it does not race the PyPI
# publish in release.yml. Tags the image with the release version and `latest`.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Strip the leading `v` from the tag (v0.1.0 -> 0.1.0) for the image tag.
      - name: Resolve version
        id: v
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rung-dev/rung:${{ steps.v.outputs.tag }}
            ghcr.io/rung-dev/rung:latest
