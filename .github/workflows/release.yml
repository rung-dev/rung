name: release

# Build and publish rung to PyPI via Trusted Publishing (OpenID Connect).
# There is no API token: PyPI trusts this repo + this workflow file + the `pypi`
# environment, configured as a Trusted Publisher (pending publisher on first
# release, which creates the project). The workflow filename registered on PyPI
# must stay "release.yml" to match.
#
# Trigger: publishing a GitHub Release (tag-driven). The relayout that adds
# pyproject.toml (src/rung/ layout) must have landed before the first release,
# or the build step has nothing to build.

on:
  release:
    types: [published]

# Least privilege by default; the publish job elevates id-token only where needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the runtime is stdlib-only by design. The suites live in
      # gate/ (the package itself moved to src/rung/; the test files did not), so
      # `-s gate` stays correct. src/ is on PYTHONPATH so the tests import rung.*
      # exactly as ci.yml drives them, rather than relying on each suite to insert
      # src/ onto sys.path itself.
      - name: Adversarial regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s gate -p 'test_*.py' -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `build` is a build-time-only dependency, so this does not violate the
      # stdlib-only RUNTIME guarantee (dependencies = [] in the wheel metadata).
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Scopes publishing rights to a dedicated environment: someone with commit
    # access cannot publish just by pushing. Configure this environment name
    # ("pypi") in the repo settings and register it on the PyPI publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/rung-ai
    permissions:
      id-token: write  # OIDC token for Trusted Publishing; no password/token stored
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password`: authentication is the OIDC id-token exchanged against
        # the Trusted Publisher. Uploads the contents of dist/ by default.
